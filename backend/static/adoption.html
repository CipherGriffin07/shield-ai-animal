<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adoption — SHIELD AI</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/auth.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5.5V11C4 16.5 7.4 20.9 12 22C16.6 20.9 20 16.5 20 11V5.5L12 2Z" fill="white" fill-opacity="0.95"/><path d="M9 12L11 14L15.5 9.5" stroke="#0E3320" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      SHIELD AI
    </a>
    <div class="nav-cta"><a class="btn-ghost" href="/">← Home</a></div>
  </div>
</nav>

<header class="page-hero">
  <div class="container">
    <span class="eyebrow">Find a companion</span>
    <h1>Adoption</h1>
    <p class="lede">Animals recovered through SHIELD, ready for a home. Applications are scored for compatibility before NGOs review them.</p>
  </div>
</header>

<div class="page-body">
  <div class="container">
    <div class="listing-grid" id="listing-grid"></div>
  </div>
</div>

<div id="apply-modal" style="display:none; position:fixed; inset:0; background:rgba(14,51,32,0.45); z-index:300; align-items:center; justify-content:center; padding:20px;">
  <div class="card panel" style="max-width:520px; width:100%; max-height:88vh; overflow-y:auto;">
    <div class="flex" style="justify-content:space-between; align-items:center;">
      <h2 style="font-size:20px;">Compatibility questionnaire</h2>
      <button onclick="closeModal()" style="font-size:22px; color:var(--ink-soft);">&times;</button>
    </div>
    <form id="apply-form" class="mt-24">
      <label class="field">
        <span>Home type</span>
        <select name="home_type">
          <option value="apartment">Apartment</option>
          <option value="house_with_yard">House with yard</option>
          <option value="farm">Farm</option>
        </select>
      </label>
      <label class="field mt-16">
        <span>Your experience with animals</span>
        <select name="experience_level">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="experienced">Experienced</option>
        </select>
      </label>
      <label class="field mt-16">
        <span>Hours available daily</span>
        <input type="number" name="daily_hours_available" min="0" max="24" value="4" required>
      </label>
      <div class="form-row-2 mt-16">
        <label class="flex" style="align-items:center; gap:8px; font-size:14px; font-weight:600;">
          <input type="checkbox" name="has_other_pets" style="width:16px;height:16px;"> Have other pets
        </label>
        <label class="flex" style="align-items:center; gap:8px; font-size:14px; font-weight:600;">
          <input type="checkbox" name="has_children" style="width:16px;height:16px;"> Have children at home
        </label>
      </div>
      <div id="apply-error" class="form-error" hidden></div>
      <div id="apply-success" class="form-success" hidden></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg mt-24">Submit application</button>
    </form>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  const grid = document.getElementById('listing-grid');
  let selectedListingId = null;

  async function load() {
    grid.innerHTML = `<p style="color:var(--ink-soft);">Loading…</p>`;
    try {
      const listings = await SHIELD_API.adoptionListings();
      if (!listings.length) { grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No animals listed for adoption right now.</div>`; return; }
      grid.innerHTML = listings.map(l => `
        <div class="listing-card card">
          <div class="listing-photo"></div>
          <div class="listing-body">
            <h3>${l.title}</h3>
            <p>${l.story || 'A recovered animal ready for a loving home.'}</p>
            <div class="flex" style="gap:6px; flex-wrap:wrap; margin-top:10px;">
              ${l.temperament_tags.map(t => `<span class="badge badge-low">${t}</span>`).join('')}
            </div>
            <button class="btn btn-primary btn-block mt-16" onclick="openApply('${l.id}')">Apply to adopt</button>
          </div>
        </div>
      `).join('');
    } catch (err) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">${err.message}</div>`;
    }
  }

  const modal = document.getElementById('apply-modal');
  window.openApply = (listingId) => {
    if (!SHIELD_API.isLoggedIn()) { window.location.href = '/login'; return; }
    selectedListingId = listingId;
    document.getElementById('apply-error').hidden = true;
    document.getElementById('apply-success').hidden = true;
    modal.style.display = 'flex';
  };
  function closeModal() { modal.style.display = 'none'; }

  const form = document.getElementById('apply-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('apply-error');
    const successBox = document.getElementById('apply-success');
    errorBox.hidden = true; successBox.hidden = true;

    const raw = Object.fromEntries(new FormData(form));
    const payload = {
      listing_id: selectedListingId,
      questionnaire: {
        home_type: raw.home_type,
        experience_level: raw.experience_level,
        daily_hours_available: parseInt(raw.daily_hours_available, 10),
        has_other_pets: !!form.has_other_pets.checked,
        has_children: !!form.has_children.checked,
        preferred_temperament: [],
      },
    };

    try {
      const app = await SHIELD_API.applyAdoption(payload);
      successBox.textContent = `Application submitted — compatibility score ${app.compatibility_score}/100.`;
      successBox.hidden = false;
      form.reset();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.hidden = false;
    }
  });

  load();
</script>

</body>
</html>
