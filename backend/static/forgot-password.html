<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — SHIELD AI</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-body">

<div class="auth-shell">
  <div class="auth-visual glass-dark">
    <a class="brand" href="/" style="color:white;">
      <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5.5V11C4 16.5 7.4 20.9 12 22C16.6 20.9 20 16.5 20 11V5.5L12 2Z" fill="white" fill-opacity="0.95"/><path d="M9 12L11 14L15.5 9.5" stroke="#0E3320" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      SHIELD AI
    </a>
    <div class="auth-visual-body">
      <h2 style="color:white; font-size: 30px;">Let's get you back in.</h2>
      <p style="color:rgba(255,255,255,0.75); margin-top:14px; font-size:15px;">
        We'll send a reset link to your email — it's valid for 30 minutes.
      </p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-inner">
      <a class="btn-ghost" href="/login" style="font-size:13.5px;">← Back to login</a>
      <h1 style="font-size: 30px; margin-top: 22px;">Reset your password</h1>
      <p class="lede" style="font-size:15px; margin-top:8px;">Enter the email associated with your account.</p>

      <form id="forgot-form" class="mt-32">
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required placeholder="you@example.com">
        </label>
        <div id="form-error" class="form-error" hidden></div>
        <div id="form-success" class="form-success" hidden></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg mt-24">Send reset link</button>
      </form>
    </div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  const form = document.getElementById('forgot-form');
  const errorBox = document.getElementById('form-error');
  const successBox = document.getElementById('form-success');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.hidden = true; successBox.hidden = true;
    const { email } = Object.fromEntries(new FormData(form));
    try {
      const res = await SHIELD_API.forgotPassword(email);
      successBox.textContent = res.message + (res.dev_reset_token ? ` (Dev token: ${res.dev_reset_token})` : '');
      successBox.hidden = false;
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.hidden = false;
    }
  });
</script>

</body>
</html>
