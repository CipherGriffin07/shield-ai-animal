<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track a rescue — SHIELD AI</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5.5V11C4 16.5 7.4 20.9 12 22C16.6 20.9 20 16.5 20 11V5.5L12 2Z" fill="white" fill-opacity="0.95"/><path d="M9 12L11 14L15.5 9.5" stroke="#0E3320" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      SHIELD AI
    </a>
    <div class="nav-cta"><a class="btn-ghost" href="/">← Home</a></div>
  </div>
</nav>

<header class="page-hero">
  <div class="container">
    <span class="eyebrow">Live status</span>
    <h1>Track a rescue</h1>
    <p class="lede">Enter the SHIELD ID from your report confirmation, e.g. SHIELD-2026-0001.</p>
    <div class="search-bar mt-24">
      <input class="field" style="padding:13px 15px; border:1.5px solid var(--line); border-radius:var(--radius-sm); font-size:15px;" id="search-input" type="text" placeholder="SHIELD-2026-0001">
      <button class="btn btn-primary" id="search-btn">Track</button>
    </div>
  </div>
</header>

<div class="page-body">
  <div class="container" style="max-width:760px;">
    <div id="result"></div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  const input = document.getElementById('search-input');
  const btn = document.getElementById('search-btn');
  const result = document.getElementById('result');

  const params = new URLSearchParams(window.location.search);
  if (params.get('id')) { input.value = params.get('id'); search(); }

  btn.addEventListener('click', search);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });

  async function search() {
    const id = input.value.trim();
    if (!id) return;
    result.innerHTML = `<p style="color:var(--ink-soft); text-align:center; padding:40px 0;">Looking up ${id}…</p>`;

    try {
      const [report, timeline] = await Promise.all([
        SHIELD_API.getReport(id), SHIELD_API.getTimeline(id),
      ]);
      renderReport(report, timeline);
    } catch (err) {
      result.innerHTML = `
        <div class="empty-state card">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3E5347" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>
          <p>${err.message}</p>
        </div>`;
    }
  }

  function renderReport(report, timeline) {
    const a = report.analysis;
    const badgeClass = { Low: 'badge-low', Moderate: 'badge-moderate', High: 'badge-high', Critical: 'badge-critical' }[report.severity] || 'badge-low';

    result.innerHTML = `
      <div class="card panel">
        <div class="flex" style="justify-content:space-between; align-items:flex-start;">
          <div>
            <span class="eyebrow">${report.status}</span>
            <h2 style="font-size:24px; margin-top:8px;">${report.display_id}</h2>
            <p style="color:var(--ink-soft); font-size:14px; margin-top:4px;">${report.animal_type} · ${report.landmark || 'Location shared'}</p>
          </div>
          <span class="badge ${badgeClass}">${report.severity}</span>
        </div>

        ${report.assigned_volunteer ? `
          <div class="card mt-24" style="padding:16px; background:var(--mint-wash); border:none;">
            <strong style="font-size:13.5px;">Assigned volunteer</strong>
            <p style="font-size:14px; margin-top:6px;">${report.assigned_volunteer.name} · ${report.assigned_volunteer.distance_km} km away${report.assigned_volunteer.has_vehicle ? ' · has vehicle' : ''}</p>
          </div>` : ''}

        <h3 style="font-size:16px; margin-top:32px;">Timeline</h3>
        <div class="timeline">
          ${timeline.map(ev => `
            <div class="timeline-item">
              <h4>${ev.status}</h4>
              ${ev.note ? `<div class="note">${ev.note}</div>` : ''}
              <div class="ts">${new Date(ev.created_at).toLocaleString()}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
