<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask SHIELD — SHIELD AI</title>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body style="background:var(--mint-wash);">

<nav class="nav">
  <div class="container nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5.5V11C4 16.5 7.4 20.9 12 22C16.6 20.9 20 16.5 20 11V5.5L12 2Z" fill="white" fill-opacity="0.95"/><path d="M9 12L11 14L15.5 9.5" stroke="#0E3320" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      SHIELD AI
    </a>
    <div class="nav-cta"><a class="btn-ghost" href="/">← Home</a></div>
  </div>
</nav>

<header class="page-hero section-tight">
  <div class="container text-center">
    <span class="eyebrow">Rescue-trained assistant</span>
    <h1 style="font-size:32px;">Ask SHIELD</h1>
    <p class="lede" style="margin:8px auto 0;">First aid, emergency steps, lost-pet advice, and general animal care.</p>
  </div>
</header>

<div class="container" style="padding-bottom:64px;">
  <div class="chat-shell card">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-suggestions" id="chat-suggestions">
      <span class="chip">My dog is bleeding, what do I do?</span>
      <span class="chip">I found a lost cat, now what?</span>
      <span class="chip">How do I approach a scared stray?</span>
    </div>
    <form class="chat-input-row" id="chat-form">
      <input type="text" id="chat-input" placeholder="Type your question…" autocomplete="off" required>
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  const messagesEl = document.getElementById('chat-messages');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const suggestions = document.getElementById('chat-suggestions');
  let history = [];

  addMessage('assistant', "Hi, I'm the SHIELD assistant. Tell me what's going on and I'll help with immediate steps — for anything serious, please also submit a report so a volunteer can be matched.");

  suggestions.addEventListener('click', (e) => {
    if (!e.target.classList.contains('chip')) return;
    input.value = e.target.textContent;
    form.requestSubmit();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    addMessage('user', message);
    input.value = '';
    suggestions.hidden = true;

    const typingId = addMessage('assistant', '…');
    try {
      const res = await SHIELD_API.chat(message, history);
      updateMessage(typingId, res.reply);
      history.push({ role: 'user', content: message }, { role: 'assistant', content: res.reply });
    } catch (err) {
      updateMessage(typingId, "Sorry, I couldn't reach the assistant just now. If this is an emergency, please submit a report directly.");
    }
  });

  function addMessage(role, text) {
    const id = 'msg-' + Math.random().toString(36).slice(2);
    const div = document.createElement('div');
    div.className = `chat-msg ${role}`;
    div.id = id;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return id;
  }

  function updateMessage(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
</script>

</body>
</html>
